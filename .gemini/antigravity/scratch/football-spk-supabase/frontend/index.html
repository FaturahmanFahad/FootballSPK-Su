<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — SPK Football</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{font-family:'Inter',sans-serif;box-sizing:border-box}
    body{background:#0a0f1e;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
    .bg-animated{position:fixed;inset:0;background:linear-gradient(135deg,#0a0f1e 0%,#0d1424 50%,#0a1628 100%);z-index:0}
    .bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.15;animation:float 8s ease-in-out infinite}
    .bg-orb-1{width:400px;height:400px;background:radial-gradient(circle,#10b981,transparent);top:-100px;left:-100px;animation-delay:0s}
    .bg-orb-2{width:300px;height:300px;background:radial-gradient(circle,#3b82f6,transparent);bottom:-80px;right:-80px;animation-delay:3s}
    .bg-orb-3{width:250px;height:250px;background:radial-gradient(circle,#6ee7b7,transparent);top:50%;left:60%;animation-delay:5s}
    .bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(16,185,129,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(16,185,129,.03) 1px,transparent 1px);background-size:40px 40px}
    @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
    .card{background:rgba(17,24,39,.85);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:48px 40px;width:100%;max-width:440px;position:relative;z-index:10;box-shadow:0 32px 80px rgba(0,0,0,.5)}
    .input-field{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px 12px 42px;color:#f9fafb;font-size:14px;outline:none;transition:all .2s}
    .input-field::placeholder{color:#4b5563}
    .input-field:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.15);background:rgba(16,185,129,.04)}
    .btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-login:hover:not(:disabled){background:linear-gradient(135deg,#34d399,#10b981);box-shadow:0 8px 24px rgba(16,185,129,.4);transform:translateY(-1px)}
    .btn-login:disabled{opacity:.65;cursor:not-allowed}
    .err-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px 16px;color:#fca5a5;font-size:13.5px;display:flex;align-items:center;gap:10px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .card{animation:slideUp .5s ease forwards}
  </style>
</head>
<body>
  <div class="bg-animated"><div class="bg-grid"></div><div class="bg-orb bg-orb-1"></div><div class="bg-orb bg-orb-2"></div><div class="bg-orb bg-orb-3"></div></div>

  <div class="card">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:36px">
      <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(5,150,105,.1));border:1px solid rgba(16,185,129,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="#10b981" stroke-width="2"/>
          <polygon points="20,8 25,14 23,21 17,21 15,14" fill="#10b981" opacity="0.9"/>
          <polygon points="20,32 15,26 17,19 23,19 25,26" fill="#10b981" opacity="0.5"/>
          <polygon points="8,15 14,15 16,21 12,26 7,22"  fill="#10b981" opacity="0.7"/>
          <polygon points="32,15 26,15 24,21 28,26 33,22" fill="#10b981" opacity="0.7"/>
        </svg>
      </div>
      <h1 style="font-size:26px;font-weight:800;color:#f9fafb;letter-spacing:-.02em;margin:0 0 6px">SPK Football</h1>
      <p style="font-size:13px;color:#6b7280;margin:0">Sistem Pendukung Keputusan — SAW + ROC</p>
      <p style="font-size:11px;color:#374151;margin:4px 0 0">Powered by Supabase</p>
    </div>

    <!-- Error -->
    <div id="err-box" class="err-box" style="display:none;margin-bottom:20px">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink:0"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 3.5a.5.5 0 01.5.5v3a.5.5 0 01-1 0V5a.5.5 0 01.5-.5zm0 7a.75.75 0 110-1.5.75.75 0 010 1.5z"/></svg>
      <span id="err-msg">Username atau password salah.</span>
    </div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <div style="margin-bottom:16px;position:relative">
        <label style="display:block;font-size:12px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Username</label>
        <div style="position:relative">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="#4b5563" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none"><path d="M8 8a3 3 0 100-6 3 3 0 000 6zm-5 6s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3z"/></svg>
          <input type="text" id="username" class="input-field" placeholder="Masukkan username" autocomplete="username" required/>
        </div>
      </div>
      <div style="margin-bottom:28px;position:relative">
        <label style="display:block;font-size:12px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Password</label>
        <div style="position:relative">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="#4b5563" style="position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none"><path d="M11.5 1A3.5 3.5 0 008 4.5V7H3a1 1 0 00-1 1v5a1 1 0 001 1h10a1 1 0 001-1V8a1 1 0 00-1-1H9V4.5A2.5 2.5 0 0111.5 2H12V1h-.5zm-4 10.5a1 1 0 110-2 1 1 0 010 2z"/></svg>
          <input type="password" id="password" class="input-field" placeholder="Masukkan password" autocomplete="current-password" required/>
          <button type="button" id="toggle-pw" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#4b5563;padding:0">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM8 11a3 3 0 110-6 3 3 0 010 6z"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" id="btn-login" class="btn-login">
        <span id="btn-text">Masuk</span>
        <div id="btn-spinner" class="spinner" style="display:none"></div>
      </button>
    </form>

    <!-- Role badges -->
    <div style="margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,.06)">
      <p style="font-size:11px;color:#4b5563;text-align:center;margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600">Hak Akses Sistem</p>
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)"><svg width="8" height="8" fill="currentColor" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"/></svg>Admin</span>
        <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(16,185,129,.12);color:#34d399;border:1px solid rgba(16,185,129,.2)"><svg width="8" height="8" fill="currentColor" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"/></svg>Pelatih</span>
        <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.2)"><svg width="8" height="8" fill="currentColor" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"/></svg>Asisten</span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = 'dashboard.html';

    document.getElementById('toggle-pw').addEventListener('click', function() {
      const pw = document.getElementById('password');
      const ic = document.getElementById('eye-icon');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      ic.innerHTML = pw.type === 'text'
        ? '<path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 00-2.79.588l.77.771A5.944 5.944 0 018 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0114.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/><path d="M11.297 9.176a3.5 3.5 0 00-4.474-4.474l.823.823a2.5 2.5 0 012.829 2.829l.822.822zm-2.943 1.299l.822.822a3.5 3.5 0 01-4.474-4.474l.823.823a2.5 2.5 0 002.829 2.829z"/><path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 001.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 018 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709z"/><path fill-rule="evenodd" d="M13.646 14.354l-12-12 .708-.708 12 12-.708.708z"/>'
        : '<path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM8 11a3 3 0 110-6 3 3 0 010 6z"/>';
    });

    function showErr(msg) {
      document.getElementById('err-msg').textContent = msg;
      document.getElementById('err-box').style.display = 'flex';
    }
    function setLoading(on) {
      document.getElementById('btn-login').disabled = on;
      document.getElementById('btn-text').textContent = on ? 'Memproses...' : 'Masuk';
      document.getElementById('btn-spinner').style.display = on ? 'block' : 'none';
    }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('err-box').style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showErr('Username dan password harus diisi.'); return; }
      setLoading(true);
      try {
        const res = await api.post('/api/auth/login', { username, password });
        if (res.ok && res.data.success && res.data.token) {
          localStorage.setItem('spk_token', res.data.token);
          localStorage.setItem('spk_user', JSON.stringify(res.data.user));
          showToast('Login berhasil! Selamat datang, ' + (res.data.user.name || res.data.user.username), 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
        } else {
          showErr(res.data.message || 'Login gagal. Periksa username dan password.');
        }
      } catch { showErr('Terjadi kesalahan. Silakan coba lagi.'); }
      finally { setLoading(false); }
    });
  </script>
</body>
</html>
